# kube-vip: floating address 192.168.50.10 for the Kubernetes API only.
# Installed through k3s's built-in Helm controller, so no helm command is needed.
#
#   sudo kubectl label node server-1 server-2 server-3 kube-vip-host=true
#   sudo kubectl apply -f files/k3s/kube-vip/helmchart.yaml
#
# The Mac VM must NOT carry the kube-vip-host label (its network interface is lima0, not eth0):
#   sudo kubectl label node server-4 kube-vip-host-
#
# Remove with: sudo kubectl -n kube-system delete helmchart kube-vip
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  repo: https://kube-vip.github.io/helm-charts
  chart: kube-vip
  targetNamespace: kube-system
  valuesContent: |-
    config:
      address: "192.168.50.10"
    env:
      vip_interface: "eth0"
      vip_arp: "true"
      cp_enable: "true"
      svc_enable: "false"
      lb_enable: "false"
      vip_leaderelection: "true"
    nodeSelector:
      kube-vip-host: "true"
    tolerations:
      - operator: Exists
