# Seerr (request.example.com), reached from the internet through the Cloudflare tunnel.
# Chart: harish2k01/seerr   Namespace: seerr   Runs on server-1 (its data is a local-path volume).
#
#   helm upgrade --install seerr harish2k01/seerr -n seerr --create-namespace -f files/seerr/values.yaml
#
# If helm says the repo is unknown, see docs/apps/seerr-cloudflare-tunnel.md.
# Path: Cloudflare -> cloudflared on server-1 -> http://192.168.50.12 (Traefik) -> this Service.

replicaCount: 1

image:
  repository: ghcr.io/seerr-team/seerr
  tag: "latest"
  pullPolicy: IfNotPresent

env:
  # Underscore, not a space. "America/New York" is not a valid zone.
  TZ: America/New_York
  PORT: "5055"

# ClusterIP: Seerr does not get its own MetalLB address. Traefik (192.168.50.12) fronts it.
service:
  type: ClusterIP
  port: 80
  targetPort: 5055
  portName: http

persistence:
  config:
    enabled: true
    mountPath: /app/config
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClassName: "local-path"

ingress:
  enabled: true
  className: "traefik"
  annotations:
    kubernetes.io/ingress.class: traefik
  hosts:
    - host: request.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# No httpRoute block: a half-filled one fails the chart's schema check
# ("values don't meet the specifications of the schema").

livenessProbe:
  httpGet:
    path: /api/v1/settings/public
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/settings/public
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
